name = "smart-cod-checkout-pro"
client_id = "YOUR_CLIENT_ID_FROM_PARTNER_DASHBOARD"
application_url = "https://your-app-domain.com"
embedded = true

[access_scopes]
scopes = "write_orders,read_orders,write_products,read_products,read_customers,write_customers,read_shipping,read_draft_orders,write_draft_orders"

[auth]
redirect_urls = [
  "https://your-app-domain.com/auth/callback",
  "https://your-app-domain.com/auth/shopify/callback",
  "https://your-app-domain.com/exitiframe",
]

[webhooks]
api_version = "2024-04"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders-create"

  [[webhooks.subscriptions]]
  topics = ["orders/updated"]
  uri = "/webhooks/orders-updated"

  [[webhooks.subscriptions]]
  topics = ["app/subscriptions/update"]
  uri = "/webhooks/billing-updated"

[pos]
embedded = false

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
dev_store_url = "your-dev-store.myshopify.com"
