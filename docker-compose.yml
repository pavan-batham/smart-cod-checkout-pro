version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://scod:scod_password@db:5432/scod_db
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
      - SHOPIFY_APP_URL=${SHOPIFY_APP_URL}
      - SCOPES=write_orders,read_products,write_products,read_customers,write_customers
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  cron:
    build: .
    command: node cron.js
    environment:
      - DATABASE_URL=postgresql://scod:scod_password@db:5432/scod_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: scod
      POSTGRES_PASSWORD: scod_password
      POSTGRES_DB: scod_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scod -d scod_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
